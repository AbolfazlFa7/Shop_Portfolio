[project]
name = "shop-portfolio"
version = "0.1.0"
description = "portfolio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "django-ninja>=1.7.1",
    "django-taggit>=6.1.0",
    "dramatiq[redis]>=2.2.1",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pyjwt>=2.14.0",
    "pyotp>=2.10.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.12.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["tests.py","test.py","tests_*", "test_*.py", "*_tests.py", "*_test.py"]

[tool.ruff.lint]
ignore = ["BLE001", "RUF012"]